# Site settings. Change these once and every page updates.

name: Footnote                # working name — swap in the final name here
tagline: Forensic notes on Indian listed companies, read from the filings.
description: >-
  A dated public archive of forensic research on Indian listed companies,
  built from annual reports, earnings call transcripts and exchange filings.
  Factual analysis only: no buy, sell or hold calls.
author: Yash Rathi
language: en-IN

# The GitHub repository that holds this site. Used to link every report
# to its public change history, which is the proof of when it was published.
# Example: https://github.com/your-username/footnote
repo_url: https://github.com/FootnotesResearch/footnotesresearch.github.io
repo_branch: main

# Leave blank. The publishing workflow fills this in automatically.
# Only set it if you build by hand for a custom domain, e.g. https://footnote.in
site_url: ""

# Shown at the foot of every page and in every plain-text file.
disclaimer: >-
  This site publishes factual analysis of public filings. It is not investment
  advice and does not recommend buying, selling or holding any security. The
  author is not registered with SEBI as a Research Analyst or Investment
  Adviser. Figures come from company filings and may contain errors; check the
  linked source before relying on any of them.
